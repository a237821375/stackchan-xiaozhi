name: StackChan K151

on:
  push:
    branches: [stackchan-head-control]
  pull_request:
    branches: [stackchan-head-control]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackchan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Host and asset tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang ripgrep
          python -m pip install -r tools/requirements-stackchan.txt

      - name: Test motion, protocol, interaction and calibration
        run: bash tools/test_stackchan.sh

      - name: Test upstream build scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: Test assets, backups and installation packages
        run: python -m unittest discover -s tests -v

  build-k151:
    name: Build K151 with ESP-IDF 6.0.1
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Skip registry-wide latest-version notifications; retain locked downloads.
      IDF_COMPONENT_CHECK_NEW_VERSION: '0'
    container:
      # Official v6.0.1 multi-platform manifest, verified through Docker Hub.
      image: espressif/idf:v6.0.1@sha256:efc19fae2f52fc6873630c668da26aa834139a063b5fb73a46ebc0dbd217b587
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify SDK and save dependency lock checksum
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version | tee "$RUNNER_TEMP/stackchan-idf-version.txt"
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          sdk = Path(os.environ['IDF_PATH']) / 'tools/cmake/version.cmake'
          parts = dict(re.findall(r'set\(IDF_VERSION_(MAJOR|MINOR|PATCH)\s+(\d+)\)', sdk.read_text()))
          assert tuple(parts[key] for key in ('MAJOR', 'MINOR', 'PATCH')) == ('6', '0', '1'), parts
          assert Path('dependencies.lock').is_file(), 'The checked-in dependency lock is required'
          PY
          sha256sum dependencies.lock > "$RUNNER_TEMP/stackchan-dependencies.sha256"
          python -m pip install -r tools/requirements-stackchan.txt

      - name: Build firmware and generate matching base assets
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py m5stack/stackchan-k151 \
            --name m5stack-stackchan-k151 \
            --language zh-CN \
            --wake-word nihaoxiaozhi
          sha256sum --check "$RUNNER_TEMP/stackchan-dependencies.sha256"
          test -s build/xiaozhi.bin
          test -s build/generated_assets.bin

      - name: Generate and validate custom expression assets
        run: |
          source "$IDF_PATH/export.sh"
          python tools/build_stackchan_assets.py \
            --source tools/stackchan-face-sources/factory-style-talking-20260929 \
            --base-assets build/generated_assets.bin \
            --output build/stackchan-assets

      - name: Bundle license notices and record build inputs and outputs
        env:
          STACKCHAN_SOURCE_SHA: ${{ github.sha }}
          STACKCHAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          source "$IDF_PATH/export.sh"
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          license_dir = Path('build/stackchan-licenses')
          license_dir.mkdir(parents=True, exist_ok=True)
          required = {
              Path('LICENSE'): 'project-MIT.txt',
              Path('main/boards/m5stack/stackchan-k151/factory_upstream/StackChan_LICENSE'): 'factory/StackChan-MIT.txt',
              Path('main/boards/m5stack/stackchan-k151/factory_upstream/ftservo/LICENSE'): 'factory/FTServo-MIT.txt',
              Path('main/boards/m5stack/stackchan-k151/factory_upstream/smooth_ui_toolkit/LICENSE'): 'factory/smooth-ui-toolkit-MIT.txt',
              Path('main/boards/m5stack/stackchan-k151/factory_upstream/provenance.json'): 'factory/provenance.json',
              Path('managed_components/espressif__esp-sr/LICENSE'): 'esp-sr/ESPRESSIF-MIT.txt',
              Path('managed_components/78__xiaozhi-fonts/idf_component.yml'): 'fonts/idf_component.yml',
              Path('managed_components/78__xiaozhi-fonts/manifest.json'): 'fonts/manifest.json',
              Path('managed_components/78__xiaozhi-fonts/CHECKSUMS.json'): 'fonts/CHECKSUMS.json',
              Path('docs/stackchan-assets-provenance.md'): 'asset-provenance.md',
              Path(os.environ['IDF_PATH']) / 'LICENSE': 'esp-idf/Apache-2.0.txt',
          }
          for source in sorted(Path('docs/licenses').glob('*')):
              if source.is_file():
                  required[source] = 'upstream-fonts/' + source.name
          # Preserve the actual downloaded components' available notices and
          # metadata, without including binaries or generated source paths.
          for source in sorted(Path('managed_components').rglob('*')):
              if source.is_file() and not source.is_symlink() and (
                  source.name.lower().startswith(('license', 'copying', 'notice'))
                  or source.name == 'idf_component.yml'
              ):
                  required.setdefault(source, 'components/' + source.relative_to('managed_components').as_posix())
          for source, relative in required.items():
              destination = license_dir / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)

          notices = json.loads(Path('docs/licenses/upstream-license-sources.json').read_text())
          for notice in notices['files']:
              actual = hashlib.sha256((Path('docs/licenses') / notice['file']).read_bytes()).hexdigest()
              assert actual == notice['sha256'], notice['file']
          license_files = sorted(path for path in license_dir.rglob('*') if path.is_file())
          asset_manifest = Path('build/stackchan-assets/manifest.json')
          manifest = json.loads(asset_manifest.read_text())
          manifest['attribution_files'] = [
              {'file': path.relative_to('build').as_posix(),
               'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
              for path in license_files
          ]
          asset_manifest.write_text(json.dumps(manifest, indent=2) + '\n')

          files = [
              'dependencies.lock',
              'tools/requirements-stackchan.txt',
              'tools/build_stackchan_assets.py',
              'tools/stackchan-face-sources/factory-style-talking-20260929/generate.py',
              'scripts/build_default_assets.py',
              'sdkconfig',
              'build/xiaozhi.bin',
              'build/generated_assets.bin',
              'build/stackchan-assets/assets.bin',
              'build/stackchan-assets/manifest.json',
          ]
          files.extend(path.as_posix() for path in license_files)
          checksums = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}
          info = {
              'source_sha': os.environ['STACKCHAN_SOURCE_SHA'],
              'run_url': os.environ['STACKCHAN_RUN_URL'],
              'board': 'm5stack/stackchan-k151',
              'variant': 'm5stack-stackchan-k151',
              'target': 'esp32s3',
              'language': 'zh-CN',
              'wake_word': 'nihaoxiaozhi',
              'idf_version': '6.0.1',
              'idf_image': 'espressif/idf:v6.0.1@sha256:efc19fae2f52fc6873630c668da26aa834139a063b5fb73a46ebc0dbd217b587',
              'sha256': checksums,
              'license_notices': 'stackchan-licenses/',
              'font_source_limit': 'The downloaded font component omits source fonts and their license files; bundled official family notices identify license text sources, not verified source font revisions.',
              'artifact_scope': 'Application and custom assets for review; device calibration and partition compatibility must be checked before deployment.',
          }
          Path('build/stackchan-build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          PY

      - name: Build the portable test installation package
        run: |
          source "$IDF_PATH/export.sh"
          python tools/build_stackchan_release.py \
            --build-dir build \
            --assets-dir build/stackchan-assets \
            --output build/stackchan-install-package \
            --version "$(python -c 'import json; print(json.load(open("build/project_description.json"))["project_version"])')"
          python - <<'PYZIP'
          import shutil
          shutil.make_archive('build/stackchan-install-package', 'zip', 'build/stackchan-install-package')
          PYZIP

      - name: Upload application, custom assets and build information
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stackchan-k151-idf6.0.1-${{ github.sha }}
          path: |
            build/xiaozhi.bin
            build/stackchan-install-package.zip
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/stackchan-assets/assets.bin
            build/stackchan-assets/manifest.json
            build/stackchan-build-info.json
            build/stackchan-licenses/
          if-no-files-found: error
          retention-days: 14
